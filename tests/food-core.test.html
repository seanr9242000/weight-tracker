<!DOCTYPE html>
<html><body><pre id="out"></pre>
<script src="test-utils.js"></script>
<script src="../coach-core.js"></script>
<script src="../food-data.js"></script>
<script src="../food-core.js"></script>
<script>
const lib = FOOD_SEED_LIBRARY;
const meal = (id) => FOOD_SEED_MEALS.find((m) => m.id === id);
const entry = (date, kcal, extra = {}) => ({
  id: `${date}-${kcal}-${Math.random()}`, date, at: 0, slot: "extra", name: "x", servings: 1,
  n: { ...emptyNutrients(), kcal, ...(extra.n || {}) }, confidence: extra.confidence || "exact",
});
const settings = (over = {}) => ({
  ...defaultSettings("2026-10-12", 205), maintenance: 3000, ...over,
});

const check_ = (name, cond) => eq(name, cond, true);
run(() => {
  // ---- nutrient math ----
  eq("empty has every key", Object.keys(emptyNutrients()), NUTRIENT_KEYS);
  eq("scale rounds to 0.1", scaleNutrients({ ...emptyNutrients(), kcal: 120, protein: 24 }, 1.375).protein, 33);
  eq("sum", sumNutrients([{ ...emptyNutrients(), kcal: 1.25 }, { ...emptyNutrients(), kcal: 2.5 }]).kcal, 3.8);

  const shake = mealNutrients(meal("meal-shake"), lib, []);
  near("shake kcal ~330", shake.n.kcal, 330, 5);
  near("shake protein ~45", shake.n.protein, 45, 1);
  eq("shake is exact", shake.confidence, "exact");
  const lunch = mealNutrients(meal("meal-prep-lunch"), lib, []);
  near("meal prep kcal ~366", lunch.n.kcal, 366, 5);
  near("meal prep protein ~56", lunch.n.protein, 56, 1);
  const lunchBbq = mealNutrients(meal("meal-prep-lunch"), lib, ["bbq-low"]);
  eq("BBQ add-on adds sodium", lunchBbq.n.sodium - lunch.n.sodium, 300);
  near("egg dinner ~770 kcal", mealNutrients(meal("meal-egg-dinner"), lib, []).n.kcal, 770, 15);
  const chainMeal = { items: [{ foodId: "chipotle-bowl", servings: 1 }, { foodId: "banana", servings: 1 }] };
  eq("any estimate item makes a meal an estimate", mealNutrients(chainMeal, lib, []).confidence, "estimate");
  eq("missing food ids are skipped", mealNutrients({ items: [{ foodId: "nope", servings: 1 }] }, lib, []).n.kcal, 0);

  const pizza = TAKEOUT_PRESETS.find((p) => p.id === "pizza");
  eq("takeout M is the base", takeoutNutrients(pizza, "M").kcal, 290);
  eq("takeout L kcal", takeoutNutrients(pizza, "L").kcal, 450);
  near("takeout L scales protein", takeoutNutrients(pizza, "L").protein, 12 * 450 / 290, 0.1);

  // ---- day totals (entry.n is per serving) ----
  const log = [entry("2026-10-12", 300), { ...entry("2026-10-12", 100), servings: 3 }, entry("2026-10-13", 999)];
  eq("dayTotals multiplies servings", dayTotals(log, "2026-10-12").kcal, 600);
  eq("dayTotals empty day", dayTotals(log, "2026-10-14").kcal, 0);

  // ---- weeks + targets ----
  eq("week of a Wednesday is Mon-Sun", weekDates("2026-10-14"), ["2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15", "2026-10-16", "2026-10-17", "2026-10-18"]);
  eq("week of a Sunday ends that day", weekDates("2026-10-18")[6], "2026-10-18");
  eq("maintain target", targetCalories(settings()), 3000);
  eq("cut 1 lb/wk", targetCalories(settings({ goal: { mode: "cut", rateLbPerWk: -1 } })), 2500);
  eq("bulk 0.5 lb/wk", targetCalories(settings({ goal: { mode: "bulk", rateLbPerWk: 0.5 } })), 3250);

  const mifflin = mifflinStJeor({ age: 26, sex: "male", heightCm: 194.3 }, 205 / 2.20462);
  near("Mifflin-St Jeor BMR", mifflin, 2019, 2);
  eq("female constant", Math.round(mifflin - mifflinStJeor({ age: 26, sex: "female", heightCm: 194.3 }, 205 / 2.20462)), 166);
  eq("starting maintenance rounds to 50", startingMaintenance({ age: 26, sex: "male", heightCm: 194.3, activity: 1.5 }, 205), 3050);

  // ---- daily guide with the weekend bank (start Mon 2026-10-12) ----
  eq("Monday guide spreads the bank", dailyGuide(settings(), [], "2026-10-12").guide, 2710);
  eq("Monday week budget", dailyGuide(settings(), [], "2026-10-12").budget, 21000);
  const weekdays = ["2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15", "2026-10-16"];
  const ate2700 = weekdays.map((d) => entry(d, 2700));
  eq("Saturday gets its bank", dailyGuide(settings(), ate2700, "2026-10-17").guide, 4250);
  eq("Sunday after a 4,500 Saturday", dailyGuide(settings(), [...ate2700, entry("2026-10-17", 4500)], "2026-10-18").guide, 3000);
  eq("unlogged past days count as planned", dailyGuide(settings(), [], "2026-10-14").guide, 2710);
  const blowout = weekdays.map((d) => entry(d, 4000));
  const over = dailyGuide(settings(), blowout, "2026-10-17");
  eq("guide never below the floor", over.guide, 1800);
  eq("over-budget flagged", over.over, true);
  eq("weekLeft counts today's intake", dailyGuide(settings(), [entry("2026-10-12", 1000)], "2026-10-12").weekLeft, 20000);
  eq("week starting midweek only budgets active days", dailyGuide(settings({ startDate: "2026-10-14" }), [], "2026-10-14").budget, 15000);
  eq("midweek start Wednesday guide", dailyGuide(settings({ startDate: "2026-10-14" }), [], "2026-10-14").guide, 2600);

  // ---- discovery + signals ----
  eq("discovery day 1", inDiscovery(settings(), "2026-10-12"), true);
  eq("discovery day 14", inDiscovery(settings(), "2026-10-25"), true);
  eq("discovery over on day 15", inDiscovery(settings(), "2026-10-26"), false);
  const s = settings();
  eq("signal neutral in discovery", signalStatus("addedSugar", 80, s, true), "neutral");
  eq("sugar under limit good", signalStatus("addedSugar", 30, s, false), "good");
  eq("sugar 1.4x warn", signalStatus("addedSugar", 50, s, false), "warn");
  eq("sugar 2x bad", signalStatus("addedSugar", 72, s, false), "bad");
  eq("sodium at limit good", signalStatus("sodium", 2300, s, false), "good");
  eq("fiber met good", signalStatus("fiber", 40, s, false), "good");
  eq("fiber 26 warn", signalStatus("fiber", 26, s, false), "warn");
  eq("fiber 10 bad", signalStatus("fiber", 10, s, false), "bad");
  eq("protein uses its target", signalStatus("protein", 150, s, false), "warn");

  // ---- planned meal lookup ----
  eq("breakfast any day", plannedMealFor(FOOD_SEED_MEALS, "breakfast", "2026-10-18").id, "meal-shake");
  eq("weekday lunch is meal prep", plannedMealFor(FOOD_SEED_MEALS, "lunch", "2026-10-14").id, "meal-prep-lunch");
  eq("weekend lunch has no plan", plannedMealFor(FOOD_SEED_MEALS, "lunch", "2026-10-17"), null);
  eq("treat meal has no plan", plannedMealFor(FOOD_SEED_MEALS, "treat-meal", "2026-10-17"), null);

  eq("mid-morning snack is Oikos", plannedMealFor(FOOD_SEED_MEALS, "snack-am", "2026-10-14").id, "meal-oikos");
  eq("evening snack is Oikos", plannedMealFor(FOOD_SEED_MEALS, "snack-eve", "2026-10-16").id, "meal-oikos");
  eq("afternoon snack has no plan", plannedMealFor(FOOD_SEED_MEALS, "snack-pm", "2026-10-14"), null);

  // ---- local search ----
  const sources = (log) => ({ log, library: lib, meals: FOOD_SEED_MEALS, presets: TAKEOUT_PRESETS });
  const past = [
    { ...entry("2026-10-12", 150), name: "Oikos Pro", at: 5 },
    { ...entry("2026-10-12", 250), name: "Quest bar", at: 9 },
    { ...entry("2026-10-11", 250), name: "Quest bar", at: 1 },
  ];
  const names = (rs) => rs.map((r) => `${r.type}:${r.name}`);
  eq("empty query = recents newest first", names(searchFoods("", sources(past))), ["recent:Quest bar", "recent:Oikos Pro"]);
  const oik = searchFoods("oik", sources(past));
  eq("past entries rank first", names(oik)[0], "recent:Oikos Pro");
  eq("library duplicate of a past entry is skipped", names(oik).filter((n) => n === "food:Oikos Pro").length, 0);
  check_("meals match too", names(oik).includes("meal:Banana + Oikos Pro"));
  const chick = names(searchFoods("chick", sources([])));
  check_("chains match", chick.includes("food:Chick-fil-A Chicken Sandwich"));
  check_("plain foods match", chick.includes("food:Chicken breast"));
  check_("takeout presets match", chick.includes("takeout:Chicken sandwich"));
  eq("every word must match, any case", names(searchFoods("CLAW white", sources([]))), ["food:White Claw"]);
  eq("no match", searchFoods("zzzz", sources(past)), []);
  eq("results carry their source", searchFoods("pizza", sources([]))[0].item.id, "pizza");
  const favs = [{ id: "a", name: "Bar A", serving: "1", n: emptyNutrients(), confidence: "estimate" },
    { id: "b", name: "Bar B", serving: "1", n: emptyNutrients(), confidence: "estimate", favorite: true }];
  eq("favorites first among foods", names(searchFoods("bar", { log: [], library: favs, meals: [], presets: [] })), ["food:Bar B", "food:Bar A"]);

  // ---- USDA online results (shape returned by the food-search function) ----
  const oikosHit = { fdcId: 2650001, dataType: "Branded", name: "Oikos Pro Plain Yogurt", brand: "Oikos Dannon Company",
    servingSize: 170, servingSizeUnit: "GRM", household: "3/4 cup (170g)",
    per100: { kcal: 94, protein: 14.7, carbs: 3.53, fat: 2.06, fiber: 0, sugar: 2.35, addedSugar: 0, sodium: 35 } };
  const oikosFood = usdaToFood(oikosHit);
  eq("usda id", oikosFood.id, "usda-2650001");
  eq("branded scales to the label serving", [oikosFood.n.kcal, oikosFood.n.protein, oikosFood.n.sodium], [159.8, 25, 59.5]);
  eq("branded serving text", oikosFood.serving, "3/4 cup (170g)");
  eq("usda foods are exact + tagged", [oikosFood.confidence, oikosFood.source], ["exact", "usda"]);
  eq("missing nutrients are 0", oikosFood.n.alcohol, 0);
  const shouty = usdaToFood({ ...oikosHit, name: "DANN OIKOS PRO MIXBERRY 4X5.3OZ", brand: "OIKOS DANONE US LLC", household: null });
  eq("ALL-CAPS names tidied", shouty.name, "Dann Oikos Pro Mixberry 4x5.3oz");
  eq("brand added when the name lacks it", usdaToFood({ ...oikosHit, name: "PROTEIN BAR, COOKIES & CREAM", brand: "QUEST BAR" }).name,
    "Protein Bar, Cookies & Cream (Quest Bar)");
  eq("brand not repeated when the name has it", oikosFood.name, "Oikos Pro Plain Yogurt");
  eq("serving falls back to grams", shouty.serving, "170 g");
  eq("branded with no added-sugar figure counts total sugar", usdaToFood({ ...oikosHit, per100: { kcal: 400, sugar: 50 } }).n.addedSugar, 85);
  const rice = usdaToFood({ fdcId: 1, dataType: "Survey (FNDDS)", name: "Rice, white, cooked, no added fat", brand: null,
    per100: { kcal: 129, protein: 2.67, carbs: 28, sugar: 0.05 } });
  eq("generic foods are per 100 g", [rice.serving, rice.n.kcal], ["100 g", 129]);
  eq("generic with no added-sugar figure counts 0", rice.n.addedSugar, 0);
  eq("ml servings", usdaToFood({ ...oikosHit, servingSizeUnit: "MLT", servingSize: 355, household: null }).serving, "355 ml");
  eq("unknown units fall back to per 100 g", usdaToFood({ ...oikosHit, servingSizeUnit: "ONZ" }).serving, "100 g");

  // ---- snack ideas ----
  eq("game day", dayType(itemsForDate("2026-10-13", {})), "game");
  eq("lift day", dayType(itemsForDate("2026-10-14", {})), "lift");
  eq("Saturday lifts", dayType(itemsForDate("2026-10-17", {})), "lift");
  eq("Sunday rests", dayType(itemsForDate("2026-10-18", {})), "rest");
  const ideaNames = (slot, type) => snackIdeasFor(SNACK_IDEAS, SNACK_PLAN, slot, type).map((i) => i.name);
  eq("game-day afternoon ideas", ideaNames("snack-pm", "game"), ["PB-banana toast", "Almonds + raisins", "Oikos Pro + oats + strawberries"]);
  eq("lift-day afternoon ideas", ideaNames("snack-pm", "lift"), ["Oikos Pro + oats + strawberries", "Tuna + rice cakes + apple", "PB-banana toast"]);
  eq("lift-day mid-morning swaps jerky for eggs", ideaNames("snack-am", "lift"), ["Oikos Pro + almonds", "Hard-boiled eggs + apple", "String cheese + almonds"]);
  eq("recovery swaps jerky for milk", ideaNames("post-lift", "lift"), ["Milk + banana", "Tuna + rice cakes + banana"]);
  check_("no ultra-processed food in any planned idea", Object.values(SNACK_PLAN).every((byType) => Object.values(byType).every((e) =>
    e.ideas.every((id) => SNACK_IDEAS.find((i) => i.id === id).items.every((it) => lib.find((f) => f.id === it.foodId).processing !== "ultra")))));
  eq("Sunday afternoon ideas", ideaNames("snack-pm", "rest").length, 3);
  eq("pre-game ideas skip the planned meal", ideaNames("pregame-snack", "game"), ["Dates + banana", "Rice cakes + honey + banana"]);
  eq("no ideas for slots without any", ideaNames("lunch", "game"), []);
  check_("every plan entry has a tip and real ideas", Object.values(SNACK_PLAN).every((byType) => Object.values(byType).every((e) =>
    e.tip && e.ideas.length && e.ideas.every((id) => SNACK_IDEAS.some((i) => i.id === id)))));
  eq("tip lookup", typeof snackTip(SNACK_PLAN, "pregame-snack", "game"), "string");
  eq("no tip without a plan", snackTip(SNACK_PLAN, "lunch", "game"), null);
  eq("edited ideas are used, in plan order", snackIdeasFor([{ ...SNACK_IDEAS.find((i) => i.id === "idea-dates-banana"), name: "Edited" }], SNACK_PLAN, "pregame-snack", "game").map((i) => i.name), ["Edited"]);
  check_("every idea's foods exist", SNACK_IDEAS.every((i) => i.items.every((it) => lib.some((f) => f.id === it.foodId))));
  const idea = (name) => SNACK_IDEAS.find((i) => i.name === name);
  near("apple + PB kcal", mealNutrients(idea("Apple + peanut butter"), lib, []).n.kcal, 291, 3);
  near("Oikos + oats + strawberries protein", mealNutrients(idea("Oikos Pro + oats + strawberries"), lib, []).n.protein, 29.4, 0.5);
  eq("portion text", portionText(idea("String cheese + apple").items, lib), "2 sticks string cheese · 1 apple");
  eq("portion text, halves", portionText([{ foodId: "peanut-butter", servings: 0.5 }, { foodId: "strawberries", servings: 1 }], lib), "1 tbsp peanut butter · ½ pint strawberries");
  eq("portion text, shake fractions", portionText(FOOD_SEED_MEALS[0].items, lib), "1⅜ scoops whey · 12 oz 1% milk");
  eq("portion text without portion info", portionText([{ foodId: "chipotle-bowl", servings: 2 }], lib), "2 × Chipotle chicken bowl");
  eq("fractions", [fmtQty(0.25), fmtQty(1.5), fmtQty(2), fmtQty(0.3)], ["¼", "1½", "2", "0.3"]);

  // ---- fuel vs feel ----
  // Tue 2026-10-13: lunch 12:00, snack-pm 15:00, pregame-snack 17:30, game 19:00.
  const tue = itemsForDate("2026-10-13", {});
  const at = (hhmm) => new Date(`2026-10-13T${hhmm}`).getTime();
  const fl = [
    { ...entry("2026-10-13", 300), name: "Lunch thing", slot: "lunch", at: at("12:05") },
    { ...entry("2026-10-13", 300), name: "PB-banana toast", slot: "snack-pm", at: at("15:10") },
    { ...entry("2026-10-13", 240), name: "Pretzels + raisins", slot: "pregame-snack", at: at("19:20") },
    { ...entry("2026-10-13", 100), name: "Gatorade", slot: "extra", at: at("18:40") },
    { ...entry("2026-10-13", 100), name: "Late extra", slot: "extra", at: at("19:30") },
    { ...entry("2026-10-12", 100), name: "Yesterday", slot: "snack-pm", at: at("15:00") - 86400000 },
  ];
  eq("foods in the 4 h before the game", foodsBefore(fl, tue, "2026-10-13", "19:00").map((e) => e.name),
    ["PB-banana toast", "Pretzels + raisins", "Gatorade"]);
  eq("a moved game moves the window", foodsBefore(fl, tue.map((i) => i.id === "game" ? { ...i, time: "16:30" } : i), "2026-10-13", "16:30").map((e) => e.name),
    ["PB-banana toast"]);
  eq("nothing before", foodsBefore([], tue, "2026-10-13", "19:00"), []);

  const feel = [
    { date: "2026-10-06", itemId: "game", energy: 4, stomach: "right", ate: ["Pretzels + raisins", "PB-banana toast"] },
    { date: "2026-10-08", itemId: "game", energy: 5, stomach: "right", ate: ["Pretzels + raisins"] },
    { date: "2026-10-09", itemId: "lift", energy: 2, stomach: "full", ate: ["PB-banana toast", "PB-banana toast"] },
    { date: "2026-10-10", itemId: "lift", stomach: "hungry", ate: [] },
  ];
  eq("fuel vs feel summary", fuelVsFeel(feel), [
    { name: "PB-banana toast", count: 2, energy: 3, stomach: { right: 1, full: 1, hungry: 0 } },
    { name: "Pretzels + raisins", count: 2, energy: 4.5, stomach: { right: 2, full: 0, hungry: 0 } },
  ]);
  eq("energy skipped when not rated", fuelVsFeel([{ ate: ["X"], stomach: "right" }])[0].energy, null);
  eq("empty log", fuelVsFeel([]), []);

  // ---- processing (NOVA-style: whole / processed / ultra) ----
  check_("every seed food is tagged", lib.every((f) => ["whole", "processed", "ultra"].includes(f.processing)));
  eq("upf nutrient key exists", NUTRIENT_KEYS.includes("upf"), true);
  const ultraFood = (kcal) => ({ id: "u", name: "U", serving: "1", n: { ...emptyNutrients(), kcal }, confidence: "exact", processing: "ultra" });
  const wholeFood = (kcal) => ({ id: "w", name: "W", serving: "1", n: { ...emptyNutrients(), kcal }, confidence: "exact", processing: "whole" });
  eq("single ultra food: all kcal are upf", foodNutrients(ultraFood(200)).upf, 200);
  eq("single whole food: no upf", foodNutrients(wholeFood(200)).upf, 0);
  eq("meal upf counts only ultra items", mealNutrients({ items: [{ foodId: "u", servings: 2 }, { foodId: "w", servings: 1 }] }, [ultraFood(100), wholeFood(300)], []).n.upf, 200);
  eq("shake counts as processed, not ultra", mealNutrients(FOOD_SEED_MEALS[0], lib, []).n.upf, 0);
  eq("takeout is ultra", takeoutNutrients(TAKEOUT_PRESETS[0], "M").upf, 290);
  const upfLog = [{ ...entry("2026-10-12", 600) }, { ...entry("2026-10-12", 400, { n: { upf: 400 } }) }, { ...entry("2026-10-13", 500) }];
  eq("upf share of the day's kcal", upfShare(upfLog, "2026-10-12"), 40);
  eq("upf share empty day", upfShare(upfLog, "2026-10-14"), 0);
  eq("old entries without upf count 0", upfShare([{ ...entry("2026-10-12", 500), n: { kcal: 500 } }], "2026-10-12"), 0);
  eq("upf signal good at 20%", signalStatus("upfPct", 20, settings(), false), "good");
  eq("upf signal warn at 28%", signalStatus("upfPct", 28, settings(), false), "warn");
  eq("upf signal bad at 45%", signalStatus("upfPct", 45, settings(), false), "bad");
  eq("upf limit falls back to 20 on old settings", signalStatus("upfPct", 25, { ...settings(), limits: { addedSugar: 36, fiber: 38, sodium: 2300 } }, false), "warn");

  // classifying online results
  eq("generic produce is whole", classifyProcessing({ dataType: "Foundation", name: "Apples, gala, with skin, raw" }), "whole");
  eq("generic snack food is ultra", classifyProcessing({ dataType: "SR Legacy", name: "Snacks, pretzels, hard, plain, salted" }), "ultra");
  eq("generic fast food is ultra", classifyProcessing({ dataType: "SR Legacy", name: "McDONALD'S, BIG MAC" }), "ultra");
  eq("generic cheese is processed", classifyProcessing({ dataType: "SR Legacy", name: "Cheese, mozzarella, low moisture, part-skim" }), "processed");
  eq("branded, one ingredient", classifyProcessing({ dataType: "Branded", name: "Almonds", ingredients: "ALMONDS." }), "whole");
  eq("branded, simple recipe", classifyProcessing({ dataType: "Branded", name: "Peanut butter", ingredients: "PEANUTS, SALT." }), "processed");
  eq("branded with UPF markers", classifyProcessing({ dataType: "Branded", name: "Bar",
    ingredients: "PROTEIN BLEND (MILK PROTEIN ISOLATE, WHEY PROTEIN ISOLATE), SOLUBLE CORN FIBER, ALMONDS, NATURAL FLAVORS, SUCRALOSE." }), "ultra");
  eq("branded long ingredient list is ultra", classifyProcessing({ dataType: "Branded", name: "X", ingredients: "A, B, C, D, E, F, G, H, I, J, K" }), "ultra");
  eq("branded, no ingredients listed", classifyProcessing({ dataType: "Branded", name: "X" }), "processed");
  eq("usdaToFood carries the tag", usdaToFood({ ...oikosHit, ingredients: "CULTURED PASTEURIZED NONFAT MILK, CREAM, LIVE CULTURES" }).processing, "processed");
  eq("usdaToFood upf for ultra items", usdaToFood({ ...oikosHit, ingredients: "MILK, SUCRALOSE" }).n.upf, usdaToFood({ ...oikosHit }).n.kcal);

  // ---- estimate share, recents, alcohol ----
  const mixed = [entry("2026-10-12", 600), entry("2026-10-12", 400, { confidence: "estimate" })];
  eq("estimated share %", estimatedShare(mixed, "2026-10-12"), 40);
  eq("estimated share empty day", estimatedShare(mixed, "2026-10-13"), 0);
  const recents = recentFoods([
    { ...entry("2026-10-12", 1), name: "A", at: 1 }, { ...entry("2026-10-12", 1), name: "B", at: 2 },
    { ...entry("2026-10-13", 1), name: "A", at: 3 },
  ], 10).map((e) => e.name);
  eq("recents newest first, distinct", recents, ["A", "B"]);
  const claw = lib.find((f) => f.id === "white-claw");
  const drinks = [{ ...entry("2026-10-17", 0), n: claw.n, servings: 3 }, { ...entry("2026-10-10", 0), n: claw.n, servings: 2 }];
  eq("week alcohol only counts this week", weekAlcohol(drinks, "2026-10-18"), { kcal: 294, drinks: 3 });

  // ---- weight slope + adaptive maintenance ----
  const weights = [];
  for (let i = 0; i < 21; i += 2) weights.push({ date: shiftDate("2026-10-01", i), weight: 205 + i * (0.5 / 7) });
  near("slope 0.5 lb/wk", weightSlope(weights, "2026-10-21", 21).slope * 7, 0.5, 0.01);
  eq("slope counts weigh-in days", weightSlope(weights, "2026-10-21", 21).count, 11);
  eq("slope needs two points", weightSlope([{ date: "2026-10-21", weight: 200 }], "2026-10-21", 21), null);
  const sameDay = [{ date: "2026-10-20", weight: 200 }, { date: "2026-10-20", weight: 202 }, { date: "2026-10-21", weight: 201 }];
  near("same-day weigh-ins average", weightSlope(sameDay, "2026-10-21", 21).slope, 0, 0.001);

  const days = {};
  const intake = [];
  for (let i = 0; i < 21; i++) {
    const d = shiftDate("2026-10-01", i);
    days[d] = { complete: true };
    intake.push(entry(d, 3200));
  }
  const p = proposeMaintenance(settings(), intake, days, weights, "2026-10-21");
  eq("proposal ready", p.ready, true);
  near("observed = intake - surplus", p.observed, 3200 - 250, 5);
  eq("proposal is halfway, rounded to 50", p.proposed, 3000);
  eq("small change not worth showing", p.worth, false);
  const high = proposeMaintenance(settings({ maintenance: 2000 }), intake, days, weights, "2026-10-21");
  eq("proposal clamped to +250", high.proposed, 2250);
  eq("big change worth showing", high.worth, true);
  const fewDays = {};
  for (let i = 0; i < 9; i++) fewDays[shiftDate("2026-10-13", i)] = { complete: true };
  const notReady = proposeMaintenance(settings(), intake, fewDays, weights, "2026-10-21");
