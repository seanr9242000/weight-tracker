<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Weight & Save</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f3f3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weight & Save">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header glass">
    <h1 class="wordmark">Weight<span>&amp; Save</span></h1>
  </header>

  <main>
    <div id="weight-panel" class="tab-panel">
      <section class="card glass-card">
        <form id="entry-form">
          <div class="field-row">
            <label for="weight-input">Weight (lbs)</label>
            <input id="weight-input" type="number" inputmode="decimal" step="0.1" min="0" placeholder="0.0" required>
          </div>
          <div class="field-row">
            <label for="date-input">Date</label>
            <div class="date-field">
              <div class="date-display" id="date-display"></div>
              <input id="date-input" type="date" class="date-input-overlay" required>
            </div>
          </div>
          <button type="submit">Add Entry</button>
        </form>
      </section>

      <section class="card">
        <h2>Trend</h2>
        <canvas id="chart" width="600" height="240"></canvas>
        <p id="chart-empty" class="empty-message">Add at least two entries to see a trend line.</p>
      </section>

      <section class="card">
        <h2>History</h2>
        <ul id="entry-list" class="entry-list"></ul>
        <p id="list-empty" class="empty-message">No entries yet.</p>
      </section>

      <section class="card">
        <h2>Progress Photos</h2>
        <div class="photo-actions">
          <div class="field-row photo-date-row">
            <label for="photo-date-input">Date</label>
            <div class="date-field">
              <div class="date-display" id="photo-date-display"></div>
              <input id="photo-date-input" type="date" class="date-input-overlay" required>
            </div>
          </div>
          <label for="photo-file-input" class="secondary-btn photo-add-btn">Add Photo</label>
          <input id="photo-file-input" type="file" accept="image/*" class="photo-file-input" hidden>
        </div>
        <div id="photo-grid" class="photo-grid"></div>
        <p id="photo-grid-empty" class="empty-message">No photos yet.</p>
      </section>
    </div>

    <div id="runs-panel" class="tab-panel" hidden>
      <section class="card glass-card">
        <div class="run-type-toggle" id="run-type-toggle">
          <button type="button" class="run-type-btn active" data-type="run">Run</button>
          <button type="button" class="run-type-btn" data-type="walk">Walk</button>
        </div>

        <div class="timer-display" id="timer-display">0:00</div>
        <div class="live-distance" id="live-distance" hidden>0.00 mi</div>

        <button type="button" id="timer-btn" class="timer-btn">Start</button>
        <p class="gps-status" id="gps-status"></p>

        <div id="live-map" class="route-map" hidden></div>

        <form id="run-save-form" class="run-save-form" hidden>
          <div class="field-row">
            <label for="run-distance-input">Distance (mi)</label>
            <input id="run-distance-input" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="field-row">
            <label for="run-date-input">Date</label>
            <div class="date-field">
              <div class="date-display" id="run-date-display"></div>
              <input id="run-date-input" type="date" class="date-input-overlay" required>
            </div>
          </div>
          <div class="run-save-actions">
            <button type="button" id="run-discard-btn" class="secondary-btn">Discard</button>
            <button type="submit">Save Run</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>History</h2>
        <ul id="run-list" class="entry-list"></ul>
        <p id="run-list-empty" class="empty-message">No runs yet.</p>
      </section>
    </div>
  </main>

  <nav class="bottom-nav glass" role="tablist">
    <button type="button" class="nav-btn active" data-tab="weight-panel" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="12" cy="12" r="3.5"></circle>
        <line x1="12" y1="12" x2="14" y2="10"></line>
      </svg>
      <span>Weight</span>
    </button>
    <button type="button" class="nav-btn" data-tab="runs-panel" role="tab">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="13" cy="2.9" r="2.1"></circle>
        <polygon points="10.95,4.93 9.35,11.13 12.25,11.87 13.85,5.67"></polygon>
        <circle cx="12.4" cy="5.3" r="1.5"></circle>
        <circle cx="10.8" cy="11.5" r="1.5"></circle>
        <polygon points="11.46,6.87 7.66,9.17 8.54,10.63 12.34,8.33"></polygon>
        <circle cx="11.9" cy="7.6" r="0.85"></circle>
        <circle cx="8.1" cy="9.9" r="0.85"></circle>
        <polygon points="11.99,8.56 15.29,6.86 14.51,5.34 11.21,7.04"></polygon>
        <circle cx="11.6" cy="7.8" r="0.85"></circle>
        <circle cx="14.9" cy="6.1" r="0.85"></circle>
        <polygon points="9.83,12.21 14.43,18.51 16.37,17.09 11.77,10.79"></polygon>
        <circle cx="10.8" cy="11.5" r="1.2"></circle>
        <circle cx="15.4" cy="17.8" r="1.2"></circle>
        <polygon points="10.02,10.59 5.62,14.39 7.18,16.21 11.58,12.41"></polygon>
        <circle cx="10.8" cy="11.5" r="1.2"></circle>
        <circle cx="6.4" cy="15.3" r="1.2"></circle>
      </svg>
      <span>Runs</span>
    </button>
  </nav>

  <div id="route-modal" class="route-modal glass" hidden>
    <button type="button" id="route-modal-close" class="secondary-btn route-modal-close">Close</button>
    <div id="route-modal-map" class="route-map route-modal-map"></div>
  </div>

  <div id="photo-modal" class="route-modal glass" hidden>
    <button type="button" id="photo-modal-close" class="secondary-btn route-modal-close">Close</button>
    <img id="photo-modal-img" class="photo-modal-img" alt="Progress photo">
    <div class="photo-modal-footer">
      <span id="photo-modal-date"></span>
      <button type="button" id="photo-modal-delete" class="delete-btn">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
