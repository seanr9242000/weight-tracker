# Only what the hosted project needs from this repo: send-pings is
# called by pg_cron with an x-cron-secret header, not a user JWT.
project_id = "weight-tracker"

[functions.send-pings]
verify_jwt = false

# Food search proxy (USDA key is the USDA_API_KEY secret). Called by
# the app with its anonymous session, so the JWT is checked.
[functions.food-search]
verify_jwt = true
